name: Continuous Integration and Deployment (CI/CD)

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ '**' ]

permissions:
  id-token: write 
  contents: read
jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Run Linter
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test
        env:
          STAGE: dev

      - name: Build Project
        run: yarn build

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-folder
          path: dist/
  deploy:
      name: Deploy Release to EC2
      needs: validate
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest

      steps:  
          - name: Checkout
            uses: actions/checkout@v7   
            
          - name: Setup AWS ECR Details
            uses: aws-actions/configure-aws-credentials@v6
            with:
              role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
              aws-region: ${{secrets.AWS_REGION}}

          - name: Login to Amazon ECR
            id: login-pf-aws-ecr
            uses: aws-actions/amazon-ecr-login@v1

          - name: Build and push the tagged docker image to Amazon ECR
            env:
              ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
              ECR_REPOSITORY: ${{secrets.AWS_ECR_REPO}}
              IMAGE_TAG: ${{ github.ref_name }}
            run: |
              docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
              docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
              docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          - name: Deploy to EC2 via SSM
            env:
              IMAGE_TAG: ${{ github.ref_name }}
            run: |
              CMD_ID=$(aws ssm send-command \
                --region ${{ secrets.AWS_REGION }} \
                --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[\"/home/ubuntu/deploy.sh $IMAGE_TAG\"]" \
                --query "Command.CommandId" --output text)

              echo "Deployment command sent: $CMD_ID for version $IMAGE_TAG. Waiting for completion..."
              aws ssm wait command-executed \
                --region ${{ secrets.AWS_REGION }} \
                --command-id "$CMD_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

              aws ssm get-command-invocation \
                --region ${{ secrets.AWS_REGION }} \
                --command-id "$CMD_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
